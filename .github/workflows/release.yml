name: Build and release Windows

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release (disable for a build-only check)
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

# Serialise releases, including manual and tag-triggered runs of the same version.
concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '8GagariN8/MacroClicker'
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          [xml]$project = Get-Content MacroClicker.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must have the form 2.1.5.' }
          $tag = "v$version"
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_NAME -ne "refs/tags/$tag") {
            throw "Tag must match the project version: $tag"
          }
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:REF_NAME -ne 'refs/heads/main') {
            throw 'Run manual releases from main only.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Engine, storage and recording checks
        run: |
          dotnet run --project tests/EngineChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Engine checks failed.' }
      - name: Web interface regression checks
        run: |
          Get-ChildItem tests/Web*.cjs | Sort-Object Name | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Failed: $($_.Name)" }
          }
      - name: Publish self-contained Windows x64 executable
        run: ./build-windows.ps1
      - name: Package and verify release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MacroClicker-${{ steps.version.outputs.version }}-win-x64
          path: release-package/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No repository checkout or application execution in the write-enabled job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: MacroClicker-${{ needs.build.outputs.version }}-win-x64
          path: package
      - name: Publish a new release without replacing existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          cd package
          sha256sum --check SHA256.txt
          # A pre-existing tag must resolve to this exact source commit.
          git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" > ../tag-refs.txt
          if [ -s ../tag-refs.txt ]; then
            tag_sha=$(awk '/\^\{\}$/ {print $1}' ../tag-refs.txt)
            if [ -z "$tag_sha" ]; then tag_sha=$(awk 'NR==1 {print $1}' ../tag-refs.txt); fi
            if [ "$tag_sha" != "$SOURCE_SHA" ]; then
              echo 'Existing tag points to different source; refusing to overwrite it.' >&2
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release/draft. Increase Version in MacroClicker.csproj.' >&2
            exit 1
          fi
          # Create a draft first. Failed uploads never expose an incomplete public release.
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft \
            --title "MacroClicker ${RELEASE_TAG#v}" --notes-file RELEASE-NOTES.md
          gh release upload "$RELEASE_TAG" MacroClicker.exe INSTRUCTIONS.txt SHA256.txt
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | sort' > ../assets.json
          python3 -c 'import json; assert json.load(open("../assets.json")) == ["INSTRUCTIONS.txt", "MacroClicker.exe", "SHA256.txt"]'
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Download: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
